<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagina non trovata · Print3DLab</title>
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='17' width='26' height='9' rx='3' fill='%23ff5b1f'/%3E%3Crect x='7' y='6' width='22' height='9' rx='3' fill='%23111112'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* pagina d'errore: indirizzo sbagliato (i percorsi iniziano con / perche' puo' aprirsi a qualsiasi profondita') */
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--inchiostro,#111112);color:var(--fondo,#f2f1ed);font-family:var(--f-testo,system-ui,sans-serif);padding:24px 16px;box-sizing:border-box;text-align:center}
    .errore{max-width:520px}
    .errore-logo{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font:650 20px/1 var(--f-titolo,system-ui,sans-serif);letter-spacing:-.02em;margin-bottom:48px}
    .errore-numero{font:650 clamp(96px,26vw,180px)/.9 var(--f-titolo,system-ui,sans-serif);letter-spacing:-.06em;color:var(--accento,#ff5b1f);margin:0}
    h1{font:650 clamp(28px,6vw,40px)/1.1 var(--f-titolo,system-ui,sans-serif);letter-spacing:-.03em;margin:18px 0 12px}
    p{color:rgba(242,241,237,.7);font-size:17px;line-height:1.5;margin:0 0 32px}
    .errore-bottoni{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .errore-bottoni a{padding:15px 24px;border-radius:999px;font-weight:600;text-decoration:none;border:1px solid rgba(255,255,255,.3);color:inherit}
    .errore-bottoni a:first-child{background:var(--fondo,#f2f1ed);color:var(--inchiostro,#111112);border-color:transparent}
  </style>
</head>
<body>
  <main class="errore">
    <a class="errore-logo" href="/">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="17" width="26" height="9" rx="3" fill="#ff5b1f"/><rect x="7" y="6" width="22" height="9" rx="3" fill="#f2f1ed"/></svg>
      Print3DLab
    </a>
    <p class="errore-numero">404</p>
    <h1>Questa pagina non esiste</h1>
    <p>Forse l'indirizzo è sbagliato, oppure la pagina è stata spostata.</p>
    <div class="errore-bottoni">
      <a href="/">Torna alla home</a>
      <a href="/#prodotti">Vedi i prodotti</a>
    </div>
  </main>
</body>
</html>
